name: Codespace Setup

on:
  workflow_dispatch:

jobs:
  setup-codespace:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Install web dependencies
      run: |
        cd web
        npm install
    
    - name: Create environment files
      run: |
        # Backend .env
        cat > backend/.env << EOF
        DATABASE_URL=sqlite:///./tokyoia.db
        SECRET_KEY=codespace-dev-key
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=30
        EOF
        
        # Web .env.local
        cat > web/.env.local << EOF
        NEXT_PUBLIC_API_URL=http://localhost:8000
        EOF
    
    - name: Setup complete
      run: |
        echo "Codespace setup complete!"
        echo "Backend server: cd backend && python app/main.py"
        echo "Web server: cd web && npm run dev"
